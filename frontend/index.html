<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Citas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="toasts"></div>

<!-- ============ ACCESO ============ -->
<section id="vista-auth" class="auth">
  <div class="auth-hero">
    <h1>📅 Citas<span>Fácil</span></h1>
    <p>Ofrece tus servicios y recibe reservas, o encuentra a tu profesional y agenda en segundos.</p>
    <ul>
      <li>✔ Horarios disponibles en tiempo real</li>
      <li>✔ Sin reservas duplicadas</li>
      <li>✔ Todo en un solo lugar</li>
    </ul>
  </div>
  <div class="auth-card">
    <div class="tabs">
      <button class="tab activa" data-form="form-login">Iniciar sesión</button>
      <button class="tab" data-form="form-registro">Registrarse</button>
    </div>
    <form id="form-login">
      <label>Correo <input type="email" name="correo" required></label>
      <label>Contraseña <input type="password" name="contrasena" required></label>
      <button class="btn grande">Ingresar</button>
    </form>
    <form id="form-registro" class="oculto">
      <div class="roles">
        <label class="rol-op"><input type="radio" name="rol" value="cliente" checked><span>🙋 Quiero agendar citas</span></label>
        <label class="rol-op"><input type="radio" name="rol" value="proveedor"><span>🛠️ Ofrezco servicios</span></label>
      </div>
      <label>Nombre completo <input type="text" name="nombre" required minlength="2"></label>
      <label>Correo <input type="email" name="correo" required></label>
      <label>Contraseña (mín. 6) <input type="password" name="contrasena" required minlength="6"></label>
      <button class="btn grande">Crear cuenta</button>
    </form>
  </div>
</section>

<!-- ============ APLICACIÓN ============ -->
<div id="vista-app" class="oculto">
  <header class="topbar">
    <div class="logo">📅 CitasFácil</div>
    <nav id="nav"></nav>
    <div class="usuario">
      <span id="nombre-usuario"></span>
      <span id="rol-usuario" class="badge"></span>
      <button id="btn-salir" class="btn peq ghost">Salir</button>
    </div>
  </header>
  <main id="contenido"></main>
</div>

<!-- ============ VENTANA EMERGENTE ============ -->
<div id="modal" class="modal oculto">
  <div class="modal-caja">
    <button id="modal-x" class="modal-x">✕</button>
    <div id="modal-cuerpo"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cliente.js"></script>
<script src="js/proveedor.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
